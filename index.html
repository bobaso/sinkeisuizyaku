<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神経衰弱</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===========================
スタート画面
=========================== -->

<div id="startScreen" class="screen">

    <div class="startMenu">

        <img
            src="title.png"
            alt="タイトル"
            class="startImage">

        <div class="menuArea">

            <button id="singleBtn" class="imageButton">

                <img src="single_button.png" alt="一人であそぶ">

            </button>

            <button id="multiBtn" class="imageButton">

                <img src="multi_button.png" alt="ふたりであそぶ">

            </button>

        </div>

    </div>

</div>
 <!-- ===========================
難易度選択画面
=========================== -->

<div id="difficultyScreen" class="hidden">

    <div class="difficultyMenu">

        <img
            src="title.png"
            alt="タイトル"
            class="difficultyBackground">

        <div class="difficultyButtons">

            <button id="easyBtn" class="imageButton">

                <img
                    src="easy_button.png"
                    alt="かんたん">

            </button>

            <button id="normalBtn" class="imageButton">

                <img
                    src="normal_button.png"
                    alt="ふつう">

            </button>

            <button id="hardBtn" class="imageButton">

                <img
                    src="hard_button.png"
                    alt="むずかしい">

            </button>

        </div>

        <button id="backBtn" class="backImageButton">

            <img
                src="back_button.png"
                alt="もどる">

        </button>

    </div>

</div>
<!-- ===========================
ゲーム画面
=========================== -->

<div id="gameScreen" class="screen hidden">

    <div class="gameContainer">

        <div class="scoreArea">

            <img
                src="score.png"
                class="scoreImage"
                alt="スコア">

            <div
                id="player1Score"
                class="scoreNumber">
                0
            </div>

            <div
                id="player2Score"
                class="scoreNumber">
                0
            </div>

        </div>

        <div id="turnText" class="turnText">
            プレイヤー1の番
        </div>

        <div id="board" class="board">
            <!-- JavaScriptでカード生成 -->
        </div>

    </div>

</div>
<!-- ===========================
ゲーム終了画面
=========================== -->
<div id="resultScreen" class="screen hidden">

    <div class="resultBox">

        <h2 id="resultTitle">
            ゲーム終了！
        </h2>

        <p id="winnerText"></p>

        <button id="retryBtn" class="menuButton">
            もう一度遊ぶ
        </button>

        <button id="homeBtn" class="menuButton">
            スタート画面へ戻る
        </button>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
